plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    id 'maven-publish'
}

group = 'xyz.chener.jms'
version = '1.0-SNAPSHOT'


dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.18'

    implementation 'io.netty:netty-all:4.2.2.Final'
    implementation 'dnsjava:dnsjava:3.6.3'

    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'com.zaxxer:HikariCP:6.3.0'



    implementation 'com.baomidou:mybatis-plus:3.5.12'
    implementation 'com.baomidou:mybatis-plus-extension:3.5.12'
    // mbp依赖spring......
    implementation 'org.springframework:spring-core:6.2.8'
    implementation 'org.springframework:spring-tx:6.2.8'


    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'

}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

kotlin {
    jvmToolchain(21)
}




jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                "Manifest-Version": 1.0,
                'Main-Class': 'xyz.chener.jms.ApplicationMain'
        )

    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory()? it:zipTree(it) }
    }
}


tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
}

publishing {
    publications {
        create("mavenPublishToLocal", MavenPublication) {
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        mavenLocal()
    }
}

